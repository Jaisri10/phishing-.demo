<!DOCTYPE html>
<html>
<head>
  <title>Cyber Awareness Demo</title>
  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
    }

    .login-box {
      width: 300px;
      margin: 100px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="login-box">
  <h2>Demo Training Portal</h2>

  <form>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <button type="submit">Login</button>
  </form>

  <p style="color:red;">
    This is a cybersecurity awareness demo page.
  </p>
</div>

</body>
</html>
